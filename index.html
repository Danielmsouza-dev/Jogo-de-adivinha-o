<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo de Adivinhação</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Jogo de Adivinhação</h1>
      <p class="instructions">
        Tente adivinhar o número secreto entre 1 e 100. Você tem até 10 tentativas!
      </p>

      <div class="game-controls">
        <label for="guessInput">Seu palpite:</label>
        <input
          type="number"
          id="guessInput"
          min="1"
          max="100"
          placeholder="Digite um número de 1 a 100"
        />
        <button id="guessButton" type="button">Chutar</button>
      </div>

      <p id="message">Faça seu primeiro chute!</p>
      <p id="attempts">Tentativas restantes: 10</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
